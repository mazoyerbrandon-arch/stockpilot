<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StockPilot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0d0f;--card:#17171a;--card2:#1f1f23;--line:#2a2a30;--text:#f4f4f5;--muted:#9b9ba3;--accent:#ff7a1a;--warn:#f59e0b;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.auth{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand.big{font-size:22px;font-weight:700;margin-bottom:4px}
.logo{width:36px;height:36px;flex-shrink:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff4d00);display:grid;place-items:center;font-weight:800;font-size:14px;color:#111}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(13,13,15,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crole{font-size:12px;color:var(--accent)}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(18,18,21,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px}
.tabs button.on{color:var(--accent)}
.tabs svg{width:22px;height:22px}
.icon-btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn.danger{color:var(--danger);width:32px;height:32px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0}
input,select{display:block;width:100%;margin-top:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:600;margin-top:10px}
.btn.primary{background:var(--accent);color:#111}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,.4)}
.btn.sm{width:auto;padding:10px 14px;margin-top:0;white-space:nowrap}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--accent);padding:8px 0;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}.pad{padding:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1}
.row input,.row select{margin-top:0}
form.row input,form.row select{flex:1;min-width:0;width:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .v{font-size:26px;font-weight:800}.kpi .l{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2,h3,h4{margin:0 0 8px}h3{font-size:16px}h4{margin:16px 0 4px;font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list.card{padding:4px 14px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item.col{flex-direction:column;align-items:stretch;gap:4px}
.item select{width:auto;margin:0;padding:8px 10px;font-size:14px}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.col .t{white-space:normal}
.s{font-size:12px;color:var(--muted)}
.qty{font-size:18px;font-weight:800;min-width:44px;text-align:right}
.qty.warn,.bigqty.warn{color:var(--warn)}
.mv{min-width:52px;text-align:center;font-weight:800;border-radius:10px;padding:6px 4px;font-size:14px}
.mv.in{background:rgba(34,197,94,.12);color:var(--ok)}.mv.out{background:rgba(255,122,26,.12);color:var(--accent)}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.badge.warn{color:var(--warn);border-color:rgba(245,158,11,.4)}
.badge.owner{color:var(--accent);border-color:rgba(255,122,26,.4)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input{flex:1;margin:0}
.chips{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.banner{background:rgba(245,158,11,.12);color:var(--warn);text-align:center;font-size:13px;padding:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bigqty{font-size:44px;font-weight:800;margin:6px 0 12px}.bigqty span{font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}
.inner{background:var(--card2)}
.inner input{background:var(--card)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{margin:0}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);font-weight:700;color:var(--text)}
.seg input:checked+span{background:var(--accent);color:#111;border-color:var(--accent)}
.row-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;text-align:left}
.row-btn.on{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#26262b;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:30;width:max-content;max-width:90vw;font-size:14px}
.toast.bad{border-color:var(--danger);color:#fecaca}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
code{font-size:12px;word-break:break-all;color:var(--muted)}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 6px}
input[type=file]{padding:10px;font-size:14px}
.ok{color:var(--ok)}.err{color:var(--danger)}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:260px}
#reader video{object-fit:cover}
.qrbox{background:#fff;border-radius:16px;padding:16px;display:grid;place-items:center;margin:8px 0}
.qrbox svg{width:220px;height:220px}
.top-actions{display:flex;gap:8px}
#print{display:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2 label{margin:10px 0}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.badge.ok{color:var(--ok);border-color:rgba(34,197,94,.4)}
a.btn{display:block;color:var(--text);text-decoration:none;text-align:center}
@media print{
  body{background:#fff;color:#000}
  #app,#modal,#toast{display:none!important}
  #print{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6mm;padding:6mm}
  .label{border:1px dashed #999;border-radius:3mm;padding:3mm;text-align:center;break-inside:avoid;font:11px/1.3 -apple-system,Arial,sans-serif;color:#000}
  .label svg{width:32mm;height:32mm}
  .label b{display:block;font-size:12px;margin-top:1mm}
  #print.doc{display:block!important;padding:12mm;font:12px/1.45 -apple-system,Arial,sans-serif;color:#000}
  #print.doc h1{font-size:20px;margin:0 0 10px}
  #print.doc table{width:100%;border-collapse:collapse;margin:10px 0}
  #print.doc .doc-head td{vertical-align:top;width:50%;padding:0 10px 0 0}
  #print.doc .doc-lines th,#print.doc .doc-lines td{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left}
  #print.doc .doc-lines td:nth-child(n+3),#print.doc .doc-lines th:nth-child(n+3){text-align:right}
  #print.doc tfoot td{font-weight:700;text-align:right;border:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="print"></div>

<script>
// =====================================================================
//  CONFIGURATION — à remplir (Supabase > Project Settings > API Keys)
//  Utiliser la clé PUBLIQUE (anon / publishable). JAMAIS la clé secrète.
// =====================================================================
const SUPABASE_URL = 'https://jgtvnkjvbhhnwrafwwqx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7OfbSN0swKXP1FjdLGPCDA_oYNP_r8c';
// =====================================================================

const $ = s => document.querySelector(s);
const app = $('#app');
const S = { user: null, isAdmin: false, memberships: [], company: null, role: null, tab: 'dash',
  allProducts: [], products: [], members: [], moves: [], support: [], adminReqs: [], q: '', onlyLow: false, mf: 'all',
  locations: [], levels: [], suppliers: [], loc: '', pos: [], poLines: [], invs: [], invCounts: [], inv: null, stats: [], statsDays: 30, audit: [], poFilter: 'open' };

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M21 16l-4 4-4-4"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 4-6 8-6s8 2 8 6"/><path d="M17 4a4 4 0 010 8"/><path d="M23 21c0-3-2-5-5-6"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/><path d="M7 12h10"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.7a2 2 0 002-1.6L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'
};

// ---------- Utilitaires ----------
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => new Date(d).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const roleLabel = r => ({ owner: 'Propriétaire', admin: 'Admin', member: 'Membre' }[r] || r);
const canWrite = () => !!S.role;
const isOwner = () => S.role === 'owner';
const isManager = () => S.role === 'owner' || S.role === 'admin';
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast hidden', 3500);
}
function errMsg(e) {
  const m = e?.message || String(e);
  if (/foreign key/i.test(m)) return 'Suppression impossible : cet élément a un historique ou est utilisé dans une commande. Archive-le plutôt.';
  if (/products_company_id_sku_key|duplicate key/i.test(m)) return 'Ce SKU existe déjà dans ton entreprise.';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(m)) return 'Confirme ton e-mail avant de te connecter.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Connexion impossible. Vérifie ton réseau.';
  return m;
}
function must(res) { if (res.error) throw res.error; return res.data; }
async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(errMsg(e), true); return false; }
}

function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { stopScan(); S.scanCb = null; S.camCb = null; $('#modal').classList.add('hidden'); $('#sheet').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ---------- Démarrage ----------
let sb = null;
if (SUPABASE_URL.includes('VOTRE-PROJET') || SUPABASE_KEY.includes('VOTRE_CLE')) {
  app.innerHTML = '<div class="center"><div class="card auth"><h2>Configuration manquante</h2><p class="muted">Renseigne SUPABASE_URL et SUPABASE_KEY en haut du fichier index.html.</p></div></div>';
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((_event, session) => {
    const prev = S.user?.id;
    S.user = session?.user || null;
    if (!S.user || S.user.id !== prev) setTimeout(boot, 0);
  });
}

async function boot() {
  closeModal();
  if (!S.user) return renderAuth('login');
  app.innerHTML = '<div class="center"><div class="spinner"></div></div>';
  const ok = await run(async () => {
    S.isAdmin = must(await sb.rpc('is_platform_admin'));
    S.memberships = must(await sb.from('company_members')
      .select('role, company_id, companies(id, name, siret, address, naf)').eq('user_id', S.user.id));
  });
  if (!ok) {
    app.innerHTML = '<div class="center"><div class="card auth"><h2>Erreur de chargement</h2><button class="btn primary" onclick="boot()">Réessayer</button><button class="link" onclick="logout()">Se déconnecter</button></div></div>';
    return;
  }
  if (!S.memberships.length) return S.isAdmin ? openApp(null) : renderCreateCompany(true);
  const saved = ls.get('sp_company');
  const m = S.memberships.find(x => x.company_id === saved) || S.memberships[0];
  await openApp(m.company_id);
}

async function openApp(companyId, tab) {
  try {
    if (companyId) {
      const m = S.memberships.find(x => x.company_id === companyId);
      let company = m?.companies;
      if (!company) {
        company = must(await sb.from('companies').select('id, name, siret, address, naf').eq('id', companyId).maybeSingle());
        if (!company) throw new Error('Accès indisponible (demande non acceptée ou expirée).');
      }
      S.company = { ...company };
      S.role = m?.role || null;
      if (m) ls.set('sp_company', companyId);
    } else { S.company = null; S.role = null; }
    S.tab = tab || (S.company ? 'dash' : 'admin');
    if (LOADERS[S.tab] && S.company) await LOADERS[S.tab]();
    S.q = ''; S.onlyLow = false; S.mf = 'all'; S.loc = ''; S.inv = null;
    await loadData();
    render();
  } catch (e) { toast(errMsg(e), true); }
}

async function loadData() {
  const jobs = [];
  if (S.company) {
    const cid = S.company.id;
    jobs.push(
      sb.from('products').select('*').eq('company_id', cid).order('name')
        .then(r => { S.allProducts = must(r); S.products = S.allProducts.filter(p => !p.archived); }),
      sb.rpc('get_company_members', { p_company: cid }).then(r => { S.members = must(r) || []; }),
      sb.from('stock_movements').select('*').eq('company_id', cid).order('created_at', { ascending: false }).limit(200)
        .then(r => { S.moves = must(r); }),
      sb.from('support_access').select('*').eq('company_id', cid).order('created_at', { ascending: false }).limit(50)
        .then(r => { S.support = must(r); }),
      sb.from('locations').select('*').eq('company_id', cid).order('is_default', { ascending: false }).order('name')
        .then(r => { S.locations = must(r); }),
      sb.from('stock_levels').select('product_id, location_id, quantity').eq('company_id', cid)
        .then(r => { S.levels = must(r); }),
      sb.from('suppliers').select('*').eq('company_id', cid).order('name')
        .then(r => { S.suppliers = must(r); })
    );
  } else { S.allProducts = []; S.products = []; S.members = []; S.moves = []; S.support = []; S.locations = []; S.levels = []; S.suppliers = []; }
  if (S.isAdmin) {
    jobs.push(sb.from('support_access').select('*').eq('admin_id', S.user.id).order('created_at', { ascending: false }).limit(50)
      .then(r => { S.adminReqs = must(r); }));
  }
  await Promise.all(jobs);
  if (S.loc && !S.locations.some(l => l.id === S.loc && !l.archived)) S.loc = '';
}

async function refresh() {
  await run(async () => { await loadData(); if (LOADERS[S.tab]) await LOADERS[S.tab](); });
  render();
}

// ---------- Écrans hors application ----------
function renderAuth(mode) {
  const login = mode === 'login';
  app.innerHTML = `<div class="center"><div class="card auth">
    <div class="brand big"><span class="logo">SP</span><span>StockPilot</span></div>
    <p class="muted">${login ? 'Connecte-toi à ton espace' : 'Crée ton compte'}</p>
    <form id="f">
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Mot de passe<input name="password" type="password" required minlength="6" autocomplete="${login ? 'current-password' : 'new-password'}"></label>
      <button class="btn primary" type="submit">${login ? 'Se connecter' : 'Créer mon compte'}</button>
    </form>
    <button class="link" onclick="renderAuth('${login ? 'signup' : 'login'}')">${login ? 'Pas encore de compte ? Inscription' : 'Déjà un compte ? Connexion'}</button>
  </div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target), email = fd.get('email').trim(), password = fd.get('password');
    const btn = e.target.querySelector('button'); btn.disabled = true;
    await run(async () => {
      if (login) must(await sb.auth.signInWithPassword({ email, password }));
      else {
        const d = must(await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } }));
        if (!d.session) { toast('Compte créé : confirme ton e-mail, puis connecte-toi.'); renderAuth('login'); }
      }
    });
    btn.disabled = false;
  };
}

function renderCreateCompany(first) {
  app.innerHTML = `<div class="center"><div class="card auth">
    <div class="brand big"><span class="logo">SP</span><span>${first ? 'Bienvenue' : 'Nouvelle entreprise'}</span></div>
    <p class="muted">Crée ton entreprise. Tu en seras le propriétaire.</p>
    <form id="f">
      <div class="lbl">SIRET (optionnel : remplit la fiche automatiquement)</div>

  const f = $('#f');

// ---------- SIRET (annuaire des entreprises, API publique de l'État) ----------
async function lookupSiret(raw, out) {
  const s = String(raw).replace(/\D/g, '');
  if (s.length !== 14 && s.length !== 9) { out.innerHTML = '<span class="err">Saisis un SIRET (14 chiffres) ou un SIREN (9 chiffres).</span>'; return null; }
  out.textContent = 'Recherche…';
  try {
    const r = await fetch('https://recherche-entreprises.api.gouv.fr/search?q=' + s + '&page=1&per_page=1');
    if (!r.ok) throw new Error();
    const e = (await r.json()).results?.[0];
    if (!e) { out.innerHTML = '<span class="err">Aucune entreprise trouvée pour ce numéro.</span>'; return null; }
    const et = (e.matching_etablissements || []).find(x => x.siret === s) || e.siege || {};
    const res = {
      siret: s.length === 14 ? s : (e.siege?.siret || null),
      name: e.nom_complet || e.nom_raison_sociale || '',
      address: et.adresse || e.siege?.adresse || '',
      naf: et.activite_principale || e.activite_principale || ''
    };
    out.innerHTML = `<span class="ok">✓ ${esc(res.name)}</span><br>${esc(res.address)}${res.naf ? ' · NAF ' + esc(res.naf) : ''}`;
    return res;
  } catch { out.innerHTML = '<span class="err">Recherche indisponible pour le moment. Saisis le nom à la main.</span>'; return null; }
}
async function siretFill(f) {
  const res = await lookupSiret(f.siret.value, $('#sirInfo2'));
  if (res) { S.sirFound = res; f.name.value = res.name.slice(0, 100); f.siret.value = res.siret || f.siret.value; }
}
async function saveCompany(f) {
  const digits = f.siret.value.replace(/\D/g, '');
  if (digits && digits.length !== 14) return toast('Le SIRET doit contenir 14 chiffres.', true);
  const fd = S.sirFound && S.sirFound.siret === digits ? S.sirFound : null;
  const row = { name: f.name.value.trim(), siret: digits || null,
    address: fd ? fd.address : (digits ? S.company.address : null), naf: fd ? fd.naf : (digits ? S.company.naf : null) };
  if (await run(async () => must(await sb.from('companies').update(row).eq('id', S.company.id)), 'Entreprise enregistrée')) {
    Object.assign(S.company, row);
    const m = S.memberships.find(x => x.company_id === S.company.id); if (m?.companies) Object.assign(m.companies, row);
    S.sirFound = null; render();
  }
}

function downloadCsv(filename, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));

  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- Chargement de bibliothèques à la demande ----------
const libs = {};
function loadLib(url, globalName) {
  if (window[globalName]) return Promise.resolve();
  return libs[url] ||= new Promise((ok, ko) => {
    const s = document.createElement('script'); s.src = url;
    s.onload = ok; s.onerror = () => { delete libs[url]; ko(new Error('Chargement impossible. Vérifie ta connexion et réessaie.')); };
    document.head.appendChild(s);
  });
}

// ---------- Import Excel / CSV ----------
const IMP_FIELDS = [
  ['name', 'Nom du produit', true, ['nom', 'designation', 'produit', 'article', 'libelle', 'name', 'intitule', 'description']],
  ['sku', 'Référence / code-barres', false, ['sku', 'reference', 'ref', 'code article', 'code', 'ean', 'code barre', 'code barres', 'gencod']],
  ['quantity', 'Quantité en stock', false, ['quantite', 'qte', 'stock', 'quantity', 'qty', 'stock actuel', 'quantite en stock']],
  ['min_stock', 'Seuil d’alerte', false, ['seuil', 'seuil d alerte', 'seuil alerte', 'stock min', 'stock minimum', 'stock mini', 'minimum', 'min', 'min stock', 'alerte']],
  ['purchase_price', 'Prix d’achat HT', false, ['prix', 'prix achat', 'prix d achat', 'prix unitaire', 'prix ht', 'pu', 'pu ht', 'pa', 'cout', 'cout unitaire', 'purchase price', 'price']]
];
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const toInt = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return Number.isFinite(n) && n > 0 ? Math.round(n) : 0; };

function openImport() {
  S.imp = null;
  openModal(`<div class="sec-h"><h3>Importer des produits</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <p class="muted small">Fichier Excel (.xlsx) ou CSV, avec une ligne d’en-têtes puis une ligne par produit. Colonnes reconnues : Nom, Référence, Quantité, Seuil, Prix d’achat.</p>
    <button class="btn ghost" onclick="downloadCsv('modele-import-stockpilot.csv',[['Nom','Référence','Quantité','Seuil','Prix d’achat'],['Carton 40x30','CART-4030',120,20,'0,85'],['Ruban adhésif 50mm','RUB-50',48,10,'2,40']])">Télécharger un modèle</button>
    ${multiLoc() ? `<label>Quantités à placer dans${locSelect('impLoc', S.loc || defLoc(), { id: 'impLoc' })}</label>` : ''}
    <label>Ton fichier<input type="file" id="impFile" accept=".csv,.xlsx,.xls,.txt,text/csv"></label>
    <div id="impBody"></div>`);
  $('#impFile').onchange = e => readImport(e.target.files[0]);
}

async function readImport(file) {
  if (!file) return;
  const body = $('#impBody'); body.innerHTML = '<p class="muted">Lecture du fichier…</p>';
  try {
    let rows;
    if (/\.xlsx?$/i.test(file.name)) {
      await loadLib('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'XLSX');
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    } else rows = parseCsv(decodeText(await file.arrayBuffer()));
    rows = rows.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
    if (rows.length < 2) throw new Error('Le fichier doit contenir une ligne d’en-têtes et au moins un produit.');
    S.imp = { headers: rows[0], data: rows.slice(1), map: guessMap(rows[0]) };
    renderImport();
  } catch (e) { body.innerHTML = `<p class="err">${esc(errMsg(e))}</p>`; }
}

function decodeText(buf) {
  let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('�')) { try { t = new TextDecoder('windows-1252').decode(buf); } catch {} }
  return t.replace(/^﻿/, '');
}

function parseCsv(text) {
  const first = text.split(/\r?\n/)[0] || '';
  const sep = [';', '\t', ','].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function guessMap(headers) {
  const h = headers.map(norm), map = {}, used = new Set();
  for (const [k, , , keys] of IMP_FIELDS) {            // 1er passage : correspondance exacte
    const i = h.findIndex((x, j) => !used.has(j) && keys.includes(x));
    map[k] = i; if (i >= 0) used.add(i);
  }
  for (const [k, , , keys] of IMP_FIELDS) {            // 2e passage : correspondance partielle
    if (map[k] >= 0) continue;
    const i = h.findIndex((x, j) => !used.has(j) && keys.some(w => x.startsWith(w + ' ') || x.endsWith(' ' + w)));
    map[k] = i; if (i >= 0) used.add(i);
  }
  return map;
}

function impRows() {
  const { data, map } = S.imp, g = (r, k) => (map[k] >= 0 ? r[map[k]] ?? '' : '');
  return data.map(r => ({ name: String(g(r, 'name')).trim(), sku: String(g(r, 'sku')).trim(), quantity: toInt(g(r, 'quantity')), min_stock: toInt(g(r, 'min_stock')), purchase_price: parseMoney(g(r, 'purchase_price')) }))
    .filter(r => r.name);
}

function renderImport() {
  const { headers, map } = S.imp, rows = impRows(), n = rows.length, pl = n > 1 ? 's' : '';
  const opts = sel => '<option value="-1">— Aucune —</option>' + headers.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || 'Colonne ' + (i + 1))}</option>`).join('');
  $('#impBody').innerHTML = `<h4>Correspondance des colonnes</h4>
    ${IMP_FIELDS.map(([k, l, req]) => `<label>${l}${req ? ' *' : ''}<select onchange="S.imp.map.${k}=+this.value;renderImport()">${opts(map[k])}</select></label>`).join('')}
    <h4>Aperçu : ${n} produit${pl}</h4>
    ${n ? `<div class="list">${rows.slice(0, 5).map(r => `<div class="item"><div class="grow"><div class="t">${esc(r.name)}</div><div class="s">${r.sku ? esc(r.sku) + ' · ' : ''}seuil ${r.min_stock}${r.purchase_price != null ? ' · ' + money(r.purchase_price) : ''}</div></div><div class="qty">${r.quantity}</div></div>`).join('')}</div>
      ${n > 5 ? `<p class="muted small">… et ${n - 5} autre${n - 5 > 1 ? 's' : ''}.</p>` : ''}` : '<p class="err">Choisis la colonne qui contient le nom du produit.</p>'}
    <p class="muted small">Si la référence existe déjà, le produit est mis à jour. Chaque écart de stock est enregistré comme mouvement « Import fichier ».</p>
    <button class="btn primary" id="impGo" ${n ? '' : 'disabled'} onclick="runImport()">Importer ${n} produit${pl}</button>`;
}

async function runImport() {
  const rows = impRows();
  if (!rows.length) return;
  if (rows.length > 5000) return toast('5000 produits maximum par import.', true);
  const btn = $('#impGo'); btn.disabled = true;
  let created = 0, updated = 0;
  const ok = await run(async () => {
    for (let i = 0; i < rows.length; i += 500) {
      btn.textContent = `Import en cours… ${Math.min(i + 500, rows.length)}/${rows.length}`;
      const r = must(await sb.rpc('import_products', { p_company: S.company.id, p_rows: rows.slice(i, i + 500), p_location: $('#impLoc')?.value || defLoc() }));
      created += r.created; updated += r.updated;
    }
  });
  if (ok) { toast(`Import terminé : ${created} créé${created > 1 ? 's' : ''}, ${updated} mis à jour`); S.imp = null; closeModal(); await refresh(); }
  else { btn.disabled = false; btn.textContent = 'Réessayer l’import'; await refresh(); }
}

// ---------- Scan QR code / code-barres (caméra, PDA, douchette) ----------
let scanner = null;
function stopScan() {
  const s = scanner; scanner = null;
  if (s) { try { s.stop().then(() => s.clear()).catch(() => {}); } catch {} }
}
async function startCamera(onText) {
  await loadLib('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js', 'Html5Qrcode');
  if (!$('#reader')) return;
  const s = new Html5Qrcode('reader');
  scanner = s;
  await s.start({ facingMode: 'environment' },
    { fps: 10, qrbox: (w, h) => { const m = Math.floor(Math.min(w, h) * 0.8); return { width: m, height: Math.floor(m * 0.75) }; } },
    text => onText(String(text).trim()), () => {});
  if (scanner !== s) { try { await s.stop(); s.clear(); } catch {} }
}
const camError = e => `<span class="err">Caméra indisponible${/Permission|NotAllowed/i.test(String(e?.name || e)) ? ' : autorise l’accès à la caméra dans les réglages du navigateur' : ''}. Tu peux saisir le code à la main.</span>`;

async function openScanner(title, onCode, onCancel) {
  openModal(`<div class="sec-h"><h3>${esc(title)}</h3><button class="icon-btn" id="scanX">✕</button></div>
    <p class="muted small">Vise le QR code StockPilot ou le code-barres du produit. Avec un PDA, appuie simplement sur la gâchette.</p>
    <div id="reader"></div>
    <p id="scanMsg" class="muted small"></p>
    <div class="lbl">Ou saisis le code à la main</div>
    <form id="scanF" class="row"><input name="code" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:0;width:auto"><button class="btn primary sm">OK</button></form>`);
  let done = false;
  const finish = code => { if (done || !code) return; done = true; S.scanCb = null; stopScan(); onCode(code); };
  S.scanCb = finish;
  $('#scanX').onclick = () => { done = true; S.scanCb = null; stopScan(); onCancel ? onCancel() : closeModal(); };
  $('#scanF').onsubmit = e => { e.preventDefault(); finish(e.target.code.value.trim()); };
  try { await startCamera(finish); } catch (e) { const m = $('#scanMsg'); if (m) m.innerHTML = camError(e); }
}

function findByCode(code) {
  const c = String(code).trim(), id = c.startsWith('SP:') ? c.slice(3) : null;
  return S.allProducts.find(p => (id && p.id === id) || (p.sku && p.sku.toLowerCase() === c.toLowerCase()));
}
function onScannedCode(code) {
  const p = findByCode(code);
  if (p && !p.archived) return openProduct(p.id, true);
  if (p) { toast('Ce produit est archivé.', true); return closeModal(); }
  if (code.startsWith('SP:')) { toast('QR code inconnu dans cette entreprise.', true); return closeModal(); }
  if (canWrite()) { toast('Code inconnu : crée le produit.'); return productForm(null, { name: '', sku: code, min_stock: 0 }); }
  toast('Aucun produit avec le code ' + code, true); closeModal();
}
function scanProduct() { if (S.company) openScanner('Scanner un produit', onScannedCode); }

// Mode « Scan rapide » : chaque scan enregistre un mouvement immédiatement (idéal PDA / douchette)
function quickScan() {
  if (!canWrite()) return toast('Accès en lecture seule.', true);
  S.qs ||= { type: 'out', qty: 1, log: [] };
  if (!S.qs.loc || !activeLocs().some(l => l.id === S.qs.loc)) S.qs.loc = S.loc || defLoc();

    <p class="muted small">PDA, douchette ou caméra : chaque code scanné enregistre le mouvement tout de suite.</p>
    <div class="seg">
      <label><input type="radio" name="qst" value="in" ${S.qs.type === 'in' ? 'checked' : ''} onchange="S.qs.type='in'"><span>+ Entrée</span></label>
      <label><input type="radio" name="qst" value="out" ${S.qs.type === 'out' ? 'checked' : ''} onchange="S.qs.type='out'"><span>− Sortie</span></label>
    </div>
    ${multiLoc() ? `<label>Emplacement${locSelect('qsloc', S.qs.loc, { onchange: 'S.qs.loc=this.value;this.blur()' })}</label>` : ''}
    <label>Quantité par scan<input id="qsQty" type="number" min="1" step="1" inputmode="numeric" value="${S.qs.qty}" onchange="S.qs.qty=Math.max(1,parseInt(this.value,10)||1);this.value=S.qs.qty;this.blur()"></label>
    <form id="qsF"><label>Code (saisie manuelle)<input id="qsCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tape un code puis Entrée"></label></form>
    <button class="btn ghost" id="qsCam">📷 Utiliser la caméra</button>
    <div id="reader" class="hidden" style="margin-top:10px"></div>
    <h4>Derniers scans</h4>
    <div id="qsLog" class="list">${qsLogHtml()}</div>`);
  $('#qsF').onsubmit = e => { e.preventDefault(); const i = $('#qsCode'), c = i.value.trim(); i.value = ''; i.blur(); if (c) qsHandle(c); };
  $('#qsCam').onclick = async () => {
    $('#reader').classList.remove('hidden'); $('#qsCam').classList.add('hidden');

    catch (e) { $('#reader').outerHTML = `<p class="muted small">${camError(e)}</p>`; }

}
const qsLogHtml = () => (S.qs?.log || []).map(e => `<div class="item">
    <div class="mv ${e.err ? '' : (e.delta[0] === '+' ? 'in' : 'out')}" ${e.err ? 'style="color:var(--danger);background:rgba(239,68,68,.12)"' : ''}>${e.err ? '✕' : e.delta}</div>
    <div class="grow"><div class="t">${esc(e.name || e.code)}</div><div class="s">${e.err ? esc(e.err) : 'Stock : ' + e.after} · ${e.at.toLocaleTimeString('fr-FR')}</div></div></div>`).join('')
  || '<p class="muted small">Aucun scan pour l’instant.</p>';

let qsQueue = Promise.resolve();
function qsHandle(code) { qsQueue = qsQueue.then(() => qsRecord(code)); }
async function qsRecord(code) {
  const p = findByCode(code), type = S.qs.type, qty = S.qs.qty, loc = S.qs.loc || defLoc();
  const e = { code, at: new Date(), name: p?.name };
  if (!p || p.archived) { e.err = p ? 'Produit archivé' : 'Code inconnu : ' + code; beep(false); }
  else {
    try {
      e.after = must(await sb.rpc('record_stock_movement', { p_product_id: p.id, p_type: type, p_quantity: qty, p_note: null, p_location_id: loc, p_source: 'scan' }));
      e.delta = (type === 'in' ? '+' : '−') + qty; p.quantity = e.after; beep(true);
    } catch (err) { e.err = errMsg(err); beep(false); }
  }
  S.qs.log.unshift(e); S.qs.log = S.qs.log.slice(0, 30);
  const l = $('#qsLog'); if (l) l.innerHTML = qsLogHtml();
  clearTimeout(S.qsT); S.qsT = setTimeout(async () => { await run(loadData); render(); }, 1500);
}

let actx;
function beep(ok) {
  try { navigator.vibrate?.(ok ? 60 : [90, 60, 90]); } catch {}
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 1250 : 280; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? 0.08 : 0.3));
  } catch {}
}

// Douchettes et PDA en mode « clavier » : ils tapent le code très vite puis Entrée
const kb = { buf: '', last: 0 };
document.addEventListener('keydown', e => {
  if (!S.user || !S.company) return;
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const now = Date.now();
  if (now - kb.last > 100) kb.buf = '';
  kb.last = now;
  if (e.key === 'Enter' || e.key === 'Tab') {
    const code = kb.buf.trim(); kb.buf = '';
    if (code.length < 3) return;
    e.preventDefault();
    if ($('#qsLog')) qsHandle(code);
    else if ($('#camLog') && S.camCb) S.camCb(code);
    else if (S.tab === 'inventory' && S.inv && !$('#modal:not(.hidden)')) invScan(code);
    else if (S.scanCb) S.scanCb(code);
    else onScannedCode(code);
  } else if (e.key.length === 1) kb.buf += e.key;
});

// ---------- QR codes et étiquettes ----------
async function qrSvg(text) {
  await loadLib('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'qrcode');
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
async function showQr(id) {
  const p = S.allProducts.find(x => x.id === id); if (!p) return;
  try {
    const svg = await qrSvg('SP:' + p.id);
    openModal(`<div class="sec-h"><h3>${esc(p.name)}</h3><button class="icon-btn" onclick="openProduct('${p.id}')">✕</button></div>
      <div class="qrbox">${svg}</div>
      <p class="muted small">Colle cette étiquette sur l’emplacement ou le produit. En la scannant, l’appli ouvre directement la fiche. Si le produit a déjà un code-barres, mets-le en référence : il fonctionnera aussi au scan.</p>
      <button class="btn primary" onclick="printLabels(['${p.id}'])">Imprimer l’étiquette</button>`);
  } catch (e) { toast(errMsg(e), true); }
}
async function printLabels(ids) {
  const list = ids ? S.allProducts.filter(p => ids.includes(p.id)) : S.products.filter(p => !S.onlyLow || p.quantity <= p.min_stock);
  if (!list.length) return toast('Aucun produit à imprimer.', true);
  if (list.length > 300) return toast('300 étiquettes maximum à la fois.', true);
  try {
    const parts = [];
    for (const p of list) parts.push(`<div class="label">${await qrSvg('SP:' + p.id)}<b>${esc(p.name)}</b>${p.sku ? esc(p.sku) : ''}</div>`);
    $('#print').className = ''; $('#print').innerHTML = parts.join('');
    setTimeout(() => window.print(), 100);
  } catch (e) { toast(errMsg(e), true); }
}

    <p>Date : ${new Date(o.ordered_at || o.created_at).toLocaleDateString('fr-FR')}</p>
    <table class="doc-lines"><thead><tr><th>Référence</th><th>Désignation</th><th>Qté</th><th>PU HT</th><th>Total HT</th></tr></thead><tbody>
    ${lines.map(l => { const p = S.allProducts.find(p => p.id === l.product_id); return `<tr><td>${esc(p?.sku || '')}</td><td>${esc(p?.name || '')}</td><td>${l.quantity}</td><td>${l.unit_price != null ? money(l.unit_price) : ''}</td><td>${l.unit_price != null ? money(l.quantity * l.unit_price) : ''}</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td colspan="4">Total HT</td><td>${money(poTotal(id))}</td></tr></tfoot></table>${o.note ? `<p>${esc(o.note)}</p>` : ''}`;
  setTimeout(() => window.print(), 100);
}
async function poStatus(id, status) {
  const msg = { ordered: 'Valider la commande ? Elle ne sera plus modifiable.', cancelled: 'Annuler cette commande ?', received: 'Clôturer la commande sans recevoir le reliquat ?' }[status];
  if (!confirm(msg)) return;
  if (await run(async () => must(await sb.rpc('set_po_status', { p_po: id, p_status: status })), 'Commande mise à jour')) { await go('orders'); poView(id); }
}
function poReceive(id) {
  const o = S.pos.find(x => x.id === id), lines = poLinesOf(id).filter(l => l.received < l.quantity);
  openModal(`<div class="sec-h"><h3>Réception n° ${o.number}</h3><button class="icon-btn" onclick="poView('${id}')">✕</button></div>
    <p class="muted small">Saisis les quantités réellement reçues. Elles entrent en stock immédiatement.</p>
    <form id="rf">${multiLoc() ? `<label>Ranger dans${locSelect('loc', S.loc || defLoc())}</label>` : ''}
    ${lines.map(l => { const p = S.allProducts.find(p => p.id === l.product_id); return `<label>${esc(p?.name || 'Produit')} <span class="muted">(reste ${l.quantity - l.received})</span><input name="q_${l.id}" type="number" min="0" inputmode="numeric" value="${l.quantity - l.received}"></label>`; }).join('')}
    <button class="btn primary">Valider la réception</button></form>`);
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, payload = lines.map(l => ({ line_id: l.id, qty: Math.max(0, parseInt(f['q_' + l.id].value, 10) || 0) })).filter(x => x.qty > 0);
    if (!payload.length) return toast('Aucune quantité saisie.', true);
    let st;
    if (await run(async () => { st = must(await sb.rpc('receive_purchase_order', { p_po: id, p_location: f.loc?.value || defLoc(), p_lines: payload })); },
      'Réception enregistrée')) { await refresh(); toast(st === 'received' ? 'Commande entièrement reçue ✓' : 'Réception partielle enregistrée'); poView(id); }
  };
}

// ---------- Inventaire ----------
VIEWS.inventory = () => {
  if (S.inv) return invCountView();
  const open = S.invs.filter(i => i.status === 'open'), done = S.invs.filter(i => i.status !== 'open');
  const busy = new Set(open.map(i => i.location_id)), free = activeLocs().filter(l => !busy.has(l.id));
  return `${back()}
    ${open.length ? `<section class="card"><h3>En cours</h3><div class="list">${open.map(i => {
      const n = S.invCounts.filter(c => c.inventory_id === i.id).length;
      return `<button class="item" onclick="S.inv='${i.id}';render()"><div class="grow"><div class="t">${esc(locName(i.location_id))}</div><div class="s">Démarré le ${fmtDate(i.created_at)} par ${esc(who(i.created_by))} · ${n} produit${n > 1 ? 's' : ''} compté${n > 1 ? 's' : ''}</div></div><span class="badge warn">Continuer ›</span></button>`;
    }).join('')}</div></section>` : ''}
    ${canWrite() && free.length ? `<section class="card"><h3>Nouvel inventaire</h3>
      <p class="muted small">Scanne ou saisis chaque produit présent. À la validation, les écarts avec le stock théorique sont corrigés et tracés.</p>
      <form onsubmit="event.preventDefault();invStart(this.loc.value)">${free.length > 1 ? `<label>Emplacement<select name="loc">${free.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>` : `<input type="hidden" name="loc" value="${free[0].id}">`}
      <button class="btn primary">Démarrer l’inventaire${free.length === 1 && multiLoc() ? ' : ' + esc(free[0].name) : ''}</button></form></section>` : ''}
    <section class="card"><h3>Historique</h3>${done.length ? `<div class="list">${done.map(i => `<div class="item"><div class="grow"><div class="t">${esc(locName(i.location_id))}</div><div class="s">${fmtDate(i.created_at)} · ${i.status === 'closed' ? 'Validé le ' + fmtDate(i.closed_at) : 'Annulé'}</div></div></div>`).join('')}</div>` : '<p class="muted">Aucun inventaire terminé.</p>'}</section>`;
};
async function invStart(loc) {
  let id;
  if (await run(async () => { id = must(await sb.rpc('start_inventory', { p_company: S.company.id, p_location: loc })); }, 'Inventaire démarré')) {
    await LOADERS.inventory(); S.inv = id; render();
  }
}
function invRows() {
  const inv = S.invs.find(i => i.id === S.inv), counts = S.invCounts.filter(c => c.inventory_id === S.inv);
  const ids = new Set([...counts.map(c => c.product_id), ...S.levels.filter(l => l.location_id === inv.location_id && l.quantity > 0).map(l => l.product_id)]);
  return [...ids].map(pid => {
    const p = S.allProducts.find(x => x.id === pid), c = counts.find(x => x.product_id === pid);
    const expected = levelOf(pid, inv.location_id), counted = c ? c.counted : null;
    return { p, expected, counted, diff: counted == null ? null : counted - expected };
  }).filter(r => r.p).sort((a, b) => (a.counted == null) - (b.counted == null) || Math.abs(b.diff || 0) - Math.abs(a.diff || 0) || a.p.name.localeCompare(b.p.name));
}
function invCountView() {
  const inv = S.invs.find(i => i.id === S.inv), rows = invRows(), counted = rows.filter(r => r.counted != null);
  const gaps = counted.filter(r => r.diff !== 0), missing = rows.filter(r => r.counted == null && r.expected > 0);
  return `<button class="link" style="margin:-4px 0 6px" onclick="S.inv=null;render()">‹ Inventaires</button>
    <section class="card"><h3>Inventaire : ${esc(locName(inv.location_id))}</h3>
      <p class="muted small" style="margin-top:0">Avec un PDA ou une douchette, scanne directement : chaque scan ajoute 1.</p>
      <form class="row" onsubmit="event.preventDefault();const i=this.code;invScan(i.value);i.value='';i.blur()">
        <input name="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Code ou nom du produit" style="flex:1;min-width:0;width:auto"><button class="btn primary sm">+1</button></form>
      <button class="btn ghost" onclick="openCamLoop('Inventaire : scan continu', invScan)">📷 Scanner avec la caméra</button>
      <div class="kpis" style="margin:12px 0 0">${kpi('Produits comptés', counted.length)}${kpi('Écarts', gaps.length, gaps.length ? 'warn' : '')}</div>
    </section>
    <div class="list card">${rows.map(r => `<div class="item">
      <div class="grow"><div class="t">${esc(r.p.name)}</div><div class="s">Attendu ${r.expected}${r.diff ? ` · <span class="${r.diff > 0 ? 'ok' : 'err'}">écart ${r.diff > 0 ? '+' : ''}${r.diff}</span>` : (r.counted != null ? ' · <span class="ok">OK</span>' : '')}</div></div>
      <input type="number" min="0" inputmode="numeric" placeholder="—" value="${r.counted ?? ''}" style="width:84px;margin:0;text-align:center" onchange="invSet('${r.p.id}', this.value)"></div>`).join('') || '<p class="muted pad">Aucun produit attendu ici. Scanne ce que tu trouves.</p>'}</div>
    ${isManager() ? `<section class="card"><h3>Valider l’inventaire</h3>
      <label style="display:flex;gap:10px;align-items:center;color:var(--text)"><input type="checkbox" id="invZero" style="width:auto;margin:0"> Mettre à 0 les ${missing.length} produit${missing.length > 1 ? 's' : ''} non compté${missing.length > 1 ? 's' : ''}</label>
      <button class="btn primary" onclick="invClose()">Valider et corriger le stock (${gaps.length} écart${gaps.length > 1 ? 's' : ''})</button></section>` : '<p class="muted small">Un admin ou le propriétaire validera cet inventaire.</p>'}
    <button class="btn danger ghost" onclick="invCancel()">Annuler l’inventaire</button>`;
}
async function invCount(pid, qty, add) {
  const n = must(await sb.rpc('count_inventory', { p_inventory: S.inv, p_product: pid, p_qty: qty, p_add: add }));
  const c = S.invCounts.find(x => x.inventory_id === S.inv && x.product_id === pid);
  if (c) c.counted = n; else S.invCounts.push({ inventory_id: S.inv, product_id: pid, counted: n });
  return n;
}
let invQueue = Promise.resolve();
function invScan(code) {
  code = String(code || '').trim(); if (!code || !S.inv) return;
  invQueue = invQueue.then(async () => {
    let p = findByCode(code);
    if (!p) { const m = S.products.filter(x => x.name.toLowerCase().includes(code.toLowerCase())); if (m.length === 1) p = m[0]; else if (m.length > 1) { beep(false); return toast('Plusieurs produits correspondent : précise.', true); } }
    if (!p) { beep(false); return toast('Produit inconnu : ' + code, true); }
    try { const n = await invCount(p.id, 1, true); beep(true); toast(`${p.name} : ${n}`); if (!$('#modal:not(.hidden)')) render(); else camLog(`${p.name} → ${n}`); }
    catch (e) { beep(false); toast(errMsg(e), true); }
  });
}
async function invSet(pid, v) {
  const q = Math.max(0, parseInt(v, 10) || 0);
  if (await run(async () => { await invCount(pid, q, false); })) render();
}
async function invClose() {
  const zero = $('#invZero')?.checked;
  if (!confirm(`Valider l’inventaire et corriger le stock ?${zero ? '\nLes produits non comptés seront mis à 0.' : ''}`)) return;
  let r;
  if (await run(async () => { r = must(await sb.rpc('close_inventory', { p_inventory: S.inv, p_zero_missing: !!zero })); })) {
    toast(`Inventaire validé : ${r.adjusted} correction${r.adjusted > 1 ? 's' : ''}`); S.inv = null; refresh();
  }
}
async function invCancel() {
  if (!confirm('Annuler cet inventaire ? Les comptages seront perdus, le stock ne change pas.')) return;
  if (await run(async () => must(await sb.rpc('cancel_inventory', { p_inventory: S.inv })), 'Inventaire annulé')) { S.inv = null; refresh(); }
}

// Caméra en continu (inventaire)
function openCamLoop(title, onCode) {
  openModal(`<div class="sec-h"><h3>${esc(title)}</h3><button class="icon-btn" onclick="closeModal();render()">✕</button></div>
    <div id="reader"></div><div id="camLog" class="muted small" style="margin-top:8px">Vise un code-barres ou un QR code.</div>
    <button class="btn primary" onclick="closeModal();render()">Terminer</button>`);
  let last = '', t = 0;
  S.camCb = onCode;
  startCamera(text => { const now = Date.now(); if (text === last && now - t < 2500) return; last = text; t = now; onCode(text); })
    .catch(e => { const r = $('#reader'); if (r) r.outerHTML = `<p class="muted small">${camError(e)}</p>`; });
}
function camLog(msg) { const l = $('#camLog'); if (l) l.innerHTML = `<span class="ok">✓ ${esc(msg)}</span>`; }

// ---------- Statistiques ----------
VIEWS.stats = () => {
  const d = S.statsDays, st = new Map(S.stats.map(x => [x.product_id, x])), now = Date.now();
  const rows = S.products.map(p => { const x = st.get(p.id) || {}; const out = Number(x.out_qty || 0); const daily = out / d;
    return { p, out, in: Number(x.in_qty || 0), lastOut: x.last_out ? new Date(x.last_out) : null, days: daily > 0 ? p.quantity / daily : Infinity,
      value: p.purchase_price != null ? p.quantity * p.purchase_price : 0 }; });
  const top = rows.filter(r => r.out > 0).sort((a, b) => b.out - a.out).slice(0, 10), maxOut = top[0]?.out || 1;
  const risk = rows.filter(r => r.days < 30).sort((a, b) => a.days - b.days).slice(0, 15);
  const dormant = rows.filter(r => r.p.quantity > 0 && (!r.lastOut || now - r.lastOut > 60 * 864e5)).sort((a, b) => b.value - a.value);
  const noPrice = S.products.filter(p => p.purchase_price == null).length;
  const totalOut = rows.reduce((a, r) => a + r.out, 0);
  return `${back()}
    <div class="chips">${[7, 30, 90].map(n => `<button class="chip ${d === n ? 'on' : ''}" onclick="S.statsDays=${n};go('stats')">${n} jours</button>`).join('')}</div>
    <div class="kpis">${kpi('Valeur du stock', money(stockValue(S.products)))}${kpi(`Sorties (${d} j)`, totalOut.toLocaleString('fr-FR'))}
      ${kpi('Rupture < 14 j', risk.filter(r => r.days < 14).length, risk.some(r => r.days < 14) ? 'warn' : '')}${kpi('Valeur dormante', money(dormant.reduce((a, r) => a + r.value, 0)))}</div>
    ${noPrice ? `<p class="muted small">${noPrice} produit${noPrice > 1 ? 's' : ''} sans prix d’achat : la valeur est incomplète.</p>` : ''}
    <section class="card"><h3>Top sorties (${d} jours)</h3>${top.length ? top.map(r => `<div style="margin:10px 0">
      <div class="sec-h small"><span>${esc(r.p.name)}</span><b>${r.out}</b></div><div class="bar"><span style="width:${Math.max(3, r.out / maxOut * 100)}%"></span></div></div>`).join('') : '<p class="muted">Aucune sortie sur la période.</p>'}</section>
    <section class="card"><h3>Risque de rupture</h3><p class="muted small" style="margin-top:0">Selon la consommation moyenne des ${d} derniers jours.</p>
      ${risk.length ? `<div class="list">${risk.map(r => `<button class="item" onclick="openProduct('${r.p.id}')"><div class="grow"><div class="t">${esc(r.p.name)}</div><div class="s">Stock ${r.p.quantity} · ${(r.out / d).toFixed(1).replace('.', ',')}/jour</div></div>
        <span class="badge ${r.days < 7 ? 'warn' : ''}">${r.p.quantity === 0 ? 'Rupture' : '≈ ' + Math.floor(r.days) + ' j'}</span></button>`).join('')}</div>` : '<p class="muted">Aucun risque détecté.</p>'}</section>
    <section class="card"><h3>Stock dormant</h3><p class="muted small" style="margin-top:0">Aucune sortie depuis plus de 60 jours.</p>
      ${dormant.length ? `<div class="list">${dormant.slice(0, 20).map(r => `<button class="item" onclick="openProduct('${r.p.id}')"><div class="grow"><div class="t">${esc(r.p.name)}</div>
        <div class="s">${r.lastOut ? 'Dernière sortie le ' + r.lastOut.toLocaleDateString('fr-FR') : 'Jamais sorti'}</div></div><div style="text-align:right"><b>${r.p.quantity}</b><div class="s">${r.value ? money(r.value) : ''}</div></div></button>`).join('')}</div>` : '<p class="muted">Rien à signaler.</p>'}</section>`;
};

// ---------- Journal d'activité ----------
const ENTITY = { products: 'Produit', locations: 'Emplacement', suppliers: 'Fournisseur', purchase_orders: 'Commande', company_members: 'Membre', companies: 'Entreprise' };
const FIELD = { name: 'nom', sku: 'référence', min_stock: 'seuil', archived: 'archivé', purchase_price: 'prix d’achat', supplier_id: 'fournisseur', reorder_qty: 'qté à recommander',
  role: 'rôle', status: 'statut', note: 'note', siret: 'SIRET', address: 'adresse', naf: 'NAF', contact: 'contact', email: 'e-mail', phone: 'téléphone', notes: 'notes' };
function fmtVal(k, v) {
  if (v == null || v === '') return '—';
  if (k === 'supplier_id') return supName(v) || 'fournisseur';
  if (k === 'archived') return v ? 'oui' : 'non';
  if (k === 'role') return roleLabel(v);
  if (k === 'status') return PO_STATUS[v]?.[0] || v;
  if (k === 'purchase_price') return money(v);
  return String(v);
}
VIEWS.audit = () => `${back()}<section class="card"><div class="sec-h"><h3>Journal d’activité</h3><button class="link" onclick="go('audit')">↻</button></div>
  <p class="muted small" style="margin-top:0">Les mouvements de stock sont dans l’onglet Mouvements.</p>
  ${S.audit.length ? `<div class="list">${S.audit.map(a => {
    const act = { insert: 'a créé', update: 'a modifié', delete: 'a supprimé' }[a.action] || a.action;
    const ch = a.action === 'update' && a.details ? Object.entries(a.details).filter(([k]) => FIELD[k]).map(([k, v]) => `${FIELD[k]} : ${esc(fmtVal(k, v.avant))} → ${esc(fmtVal(k, v.apres))}`).join('<br>') : (a.details?.role ? 'rôle : ' + roleLabel(a.details.role) : '');
    return `<div class="item col"><div class="t" style="white-space:normal">${esc(a.user_id ? who(a.user_id) : 'Système')} ${act} ${(ENTITY[a.entity] || a.entity).toLowerCase()} « ${esc(a.label || '')} »</div>
      <div class="s">${fmtDate(a.created_at)}${ch ? '<br>' + ch : ''}</div></div>`;
  }).join('')}</div>` : '<p class="muted">Aucune activité enregistrée.</p>'}</section>`;

// ---------- Équipe & support ----------
async function renameCompany(f) {
  const name = new FormData(f).get('name').trim();
  if (await run(async () => must(await sb.from('companies').update({ name }).eq('id', S.company.id)), 'Entreprise renommée')) {
    S.company.name = name;
    const m = S.memberships.find(x => x.company_id === S.company.id); if (m?.companies) m.companies.name = name;
    render();
  }
}
async function addMember(f) {
  const fd = new FormData(f);
  if (await run(async () => must(await sb.rpc('add_company_member', { p_company: S.company.id, p_email: fd.get('email').trim(), p_role: fd.get('role') })), 'Employé ajouté')) refresh();
}
async function changeRole(uid, role) {
  await run(async () => must(await sb.rpc('change_member_role', { p_company: S.company.id, p_user: uid, p_role: role })), 'Rôle modifié');
  refresh();
}
async function removeMember(uid) {
  const self = uid === S.user.id;
  if (!confirm(self ? 'Quitter cette entreprise ?' : 'Retirer ce membre ?')) return;
  if (await run(async () => must(await sb.rpc('remove_company_member', { p_company: S.company.id, p_user: uid })), self ? 'Tu as quitté l’entreprise' : 'Membre retiré')) {
    if (self) { ls.set('sp_company', ''); boot(); } else refresh();
  }
}
async function transferOwnership(f) {
  const uid = new FormData(f).get('user');
  if (!confirm('Transférer la propriété ? Tu deviendras admin.')) return;
  if (await run(async () => must(await sb.rpc('transfer_ownership', { p_company: S.company.id, p_new_owner: uid })), 'Propriété transférée')) boot();
}
async function respondSupport(id, approve) {
  if (await run(async () => must(await sb.rpc('respond_support_access', { p_request: id, p_approve: approve })), approve ? 'Accès accordé' : 'Demande refusée')) refresh();
}
async function revokeSupport(id) {
  if (await run(async () => must(await sb.rpc('revoke_support_access', { p_request: id })), 'Accès coupé')) refresh();
}
async function requestSupport(f) {
  const fd = new FormData(f);
  if (await run(async () => must(await sb.rpc('request_support_access', {
    p_company: fd.get('company').trim(), p_reason: fd.get('reason').trim(), p_hours: parseInt(fd.get('hours'), 10)
  })), 'Demande envoyée')) { f.reset(); refresh(); }
}
